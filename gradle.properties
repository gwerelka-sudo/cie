# ====================================================================
#  ВАЖНО: перед первой сборкой сверь эти номера версий на
#  https://fabricmc.net/develop/  (выбери 1.21.11) — там всегда
#  актуальные билды Yarn / Loader / Fabric API. Значения ниже — это
#  последние известные на момент написания мода, но Yarn/Fabric API
#  выпускают новые билды часто, а точной сборки я подтвердить не могу.
# ====================================================================

# Minecraft / mappings / loader
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.1
loader_version=0.18.0

# Fabric Loom (build plugin). 1.21.11 официально требует Loom 1.14+.
loom_version=1.14-SNAPSHOT

# Fabric API — ЗАЙДИ на https://fabricmc.net/develop/ и вставь версию
# для 1.21.11, она обновляется примерно раз в 1-2 недели.
fabric_api_version=0.141.2+1.21.11

# Mod properties
mod_version=1.0.0
maven_group=com.cie
archives_base_name=cie

# Adventure (MiniMessage) — чистые Java-библиотеки, без спец. репозитория,
# лежат на Maven Central.
adventure_version=4.24.0
adventure_minimessage_version=4.24.0

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
