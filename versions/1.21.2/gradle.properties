# ====================================================================
#  Портировано на 1.21.4 (спущено с 1.21.5-ветки, изначально 1.21.10/11).
#  На 1.21.4 нет компонентов blocks_attacks / weapon / break_sound /
#  tooltip_display — они появились только в 1.21.5. Соответствующие
#  Util-классы (BlockAttacksUtil, WeaponUtil, BreakSoundUtil,
#  TooltipDisplayUtil) и весь код, который их использует, нужно
#  вычистить/адаптировать вручную — компилятор укажет, где именно.
# ====================================================================

# Minecraft / mappings / loader
minecraft_version=1.21.2
yarn_mappings=1.21.2+build.1
loader_version=0.18.0

# Fabric Loom. 1.21.4 официально собирается Loom 1.9.
loom_version=1.9-SNAPSHOT

# Fabric API — актуальный релизный билд под 1.21.4 на момент порта.
fabric_api_version=0.106.1+1.21.2


# Mod properties
mod_version=1.0.0
maven_group=com.cie
archives_base_name=cie

# Adventure (MiniMessage) — чистые Java-библиотеки, без спец. репозитория,
# лежат на Maven Central.
adventure_version=4.24.0
adventure_minimessage_version=4.24.0

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
