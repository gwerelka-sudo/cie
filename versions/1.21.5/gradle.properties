# ====================================================================
#  Портировано на 1.21.5 (спущено с 1.21.10/11). Версии ниже подобраны
#  под 1.21.5 по состоянию на момент порта — Fabric API выпускает новые
#  билды часто даже для старых версий Minecraft, так что перед первой
#  сборкой стоит свериться на https://fabricmc.net/develop/ (выбери
#  1.21.5) на случай более свежего патч-билда fabric_api_version.
#  yarn_mappings/loader_version/loom_version для конкретно 1.21.5 меняются
#  редко (этой версии больше года), поэтому ниже — стабильные значения.
# ====================================================================

# Minecraft / mappings / loader
minecraft_version=1.21.5
yarn_mappings=1.21.5+build.1
loader_version=0.18.0

# Fabric Loom (build plugin). 1.21.5 официально требует Loom 1.10.
loom_version=1.10-SNAPSHOT

# Fabric API — актуальный релизный билд под 1.21.5 на момент порта.
fabric_api_version=0.119.5+1.21.5

# Mod properties
mod_version=1.0.0
maven_group=com.cie
archives_base_name=cie

# Adventure (MiniMessage) — чистые Java-библиотеки, без спец. репозитория,
# лежат на Maven Central.
adventure_version=4.24.0
adventure_minimessage_version=4.24.0

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
