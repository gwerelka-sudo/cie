plugins {

    id 'fabric-loom' version "1.14-SNAPSHOT"
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    // Ported down from 1.21.11 to 1.21.10 — same input API generation
    // (Click/CharInput/KeyInput introduced back in 1.21.9), so no mixin
    // changes were needed, only the version/mappings/fabric-api bump-down
    // in gradle.properties and fabric.mod.json.
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // --- Adventure / MiniMessage -------------------------------------
    // We deliberately do NOT depend on adventure-platform-fabric here.
    // We only need MiniMessage -> Adventure Component -> JSON -> vanilla
    // Text conversion, which the plain adventure-api + adventure-text-
    // minimessage + adventure-text-serializer-gson artifacts already do,
    // with zero Fabric-specific mixins/quirks to worry about. They are
    // pure Java libraries published straight to Maven Central, so we
    // just shade them into the mod jar.
    include implementation("net.kyori:adventure-api:${adventure_version}")
    // net.kyori:option — small standalone lib (own versioning, not tied to adventure_version)
    // that GsonComponentSerializer.gson() needs at runtime for OptionState. Same failure
    // pattern as adventure-key above: fine at compile time (transitive), missing at runtime
    // because it was never shaded in.
    include implementation("net.kyori:option:1.1.0")
    // adventure-key: Key/InvalidKeyException live here. adventure-api depends on it
    // transitively (compiles fine without it) but it wasn't being shaded into the
    // jar, so MiniMessage.builder() -> StandardTags.<clinit> throws
    // NoClassDefFoundError the first time any command touches MiniMessageBridge.
    // Same failure shape as the missing adventure-text-serializer-json fix earlier.
    include implementation("net.kyori:adventure-key:${adventure_version}")
    include implementation("net.kyori:adventure-text-minimessage:${adventure_minimessage_version}")
    // adventure-text-serializer-gson EXTENDS JSONComponentSerializer, which lives in
    // this separate artifact. It's a transitive COMPILE dependency (so the project
    // still compiles fine without it) but it was never being shaded into the jar,
    // so at runtime GsonComponentSerializer's static init throws NoClassDefFoundError
    // the first time anything touches MiniMessageBridge. This line is the actual fix
    // for the crash.
    include implementation("net.kyori:adventure-text-serializer-json:${adventure_version}")
    include implementation("net.kyori:adventure-text-serializer-json-legacy-impl:${adventure_version}")
    include implementation("net.kyori:adventure-text-serializer-gson:${adventure_version}")
    include implementation("net.kyori:adventure-text-serializer-legacy:${adventure_version}")
    include implementation("net.kyori:adventure-text-serializer-plain:${adventure_version}")
    include implementation("net.kyori:examination-api:1.3.0")
    include implementation("net.kyori:examination-string:1.3.0")
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
kotlin {
    jvmToolchain(21)
}
