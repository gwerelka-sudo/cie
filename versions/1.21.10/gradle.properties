# ====================================================================
#  Спущено с 1.21.11 на 1.21.10 (для релиза на Modrinth в диапазоне
#  1.21.2-1.21.10). ВАЖНО: перед сборкой сверь эти номера версий на
#  https://fabricmc.net/develop/ (выбери 1.21.10) — там всегда
#  актуальные билды Yarn / Loader / Fabric API. Значения ниже — это
#  последние известные на момент правки (декабрь 2025), но Yarn/Fabric
#  API выпускают новые билды часто.
# ====================================================================

# Minecraft / mappings / loader
minecraft_version=1.21.10
yarn_mappings=1.21.10+build.2
loader_version=0.18.0

# Fabric Loom (build plugin). Loom 1.14 поддерживает и 1.21.10, и 1.21.11.
loom_version=1.14-SNAPSHOT

# Fabric API — последний релиз под 1.21.10 (проверено на fabricmc.net /
# CurseForge, декабрь 2025). Если понадобится более свежий билд —
# смотри https://fabricmc.net/develop/ и выбери 1.21.10 в селекторе.
fabric_api_version=0.138.4+1.21.10

# Mod properties
mod_version=1.0.0
maven_group=com.cie
archives_base_name=cie

# Adventure (MiniMessage) — чистые Java-библиотеки, без спец. репозитория,
# лежат на Maven Central.
adventure_version=4.24.0
adventure_minimessage_version=4.24.0

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
