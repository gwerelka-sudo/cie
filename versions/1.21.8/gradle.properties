# ====================================================================
#  Спущено с 1.21.11 → 1.21.10 → 1.21.9 → 1.21.8 (для релиза на
#  Modrinth в диапазоне 1.21.2-1.21.10). ВАЖНО начиная с этой версии:
#  1.21.8 — версия ДО рефакторинга ввода 1.21.9 (Click/CharInput/
#  KeyInput там ещё НЕ существуют — используются старые сигнатуры
#  mouseClicked(double, double, int), keyPressed(int, int, int) и
#  т.д., см. миксины в src/main/java/com/cie/mixin/ и комментарии в
#  ColorPickScreen.java / armorStandEditScreen.java). Если решишь
#  спускаться ещё ниже (1.21.7 и дальше), эти сигнатуры остаются
#  актуальными вплоть до Screen API 1.21.6 рефакторинга рендера — но
#  ДРУГИЕ вещи могут отсутствовать на более старых версиях (см. общее
#  предупреждение ниже).
#
#  Перед сборкой сверь эти номера версий на
#  https://fabricmc.net/develop/ (выбери 1.21.8) — там всегда
#  актуальные билды Yarn / Loader / Fabric API. Значения ниже — это
#  последние известные на момент правки (ноябрь 2025), но Yarn/Fabric
#  API выпускают новые билды часто.
# ====================================================================

# Minecraft / mappings / loader
minecraft_version=1.21.8
yarn_mappings=1.21.8+build.1
loader_version=0.18.0

# Fabric Loom (build plugin). Loom 1.14 поддерживает и 1.21.8, и более
# новые версии — универсален, менять не нужно при спуске версий.
loom_version=1.14-SNAPSHOT

# Fabric API — последний релиз под 1.21.8 (проверено на Modrinth,
# ноябрь 2025). Если понадобится более свежий билд — смотри
# https://fabricmc.net/develop/ и выбери 1.21.8 в селекторе.
fabric_api_version=0.136.1+1.21.8

# Mod properties
mod_version=3.0.2
maven_group=com.cie
archives_base_name=cie

# Adventure (MiniMessage) — чистые Java-библиотеки, без спец. репозитория,
# лежат на Maven Central.
adventure_version=4.24.0
adventure_minimessage_version=4.24.0

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
